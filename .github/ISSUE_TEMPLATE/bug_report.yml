name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versions
      description: Output of `claude --version`, and the pinboard version.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options: [Terminal, Fullscreen terminal, Desktop app]
    validations:
      required: true
